<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Issue Companion - Sign In</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }
    .container {
      background: white;
      border-radius: 8px;
      box-shadow: 0 10px 40px rgba(0,0,0,0.2);
      width: 100%;
      max-width: 400px;
      padding: 40px;
    }
    h1 {
      font-size: 24px;
      margin-bottom: 8px;
      color: #333;
    }
    .subtitle {
      color: #666;
      font-size: 13px;
      margin-bottom: 30px;
    }
    label {
      display: block;
      font-size: 12px;
      font-weight: 600;
      color: #555;
      margin-bottom: 8px;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }
    select {
      width: 100%;
      padding: 12px;
      margin-bottom: 20px;
      border: 1px solid #ddd;
      border-radius: 4px;
      font-size: 14px;
      background: white;
      cursor: pointer;
    }
    select:focus {
      outline: none;
      border-color: #667eea;
      box-shadow: 0 0 0 3px rgba(102, 126, 234, 0.1);
    }
    button {
      width: 100%;
      padding: 12px;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      color: white;
      border: none;
      border-radius: 4px;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
      transition: transform 0.2s, box-shadow 0.2s;
    }
    button:hover {
      transform: translateY(-2px);
      box-shadow: 0 5px 20px rgba(102, 126, 234, 0.4);
    }
    button:active {
      transform: translateY(0);
    }
    .message {
      margin-top: 15px;
      padding: 12px;
      background: #f0f4ff;
      border-left: 3px solid #667eea;
      border-radius: 4px;
      font-size: 12px;
      color: #555;
      display: none;
    }
    .message.show { display: block; }
    .message.success { background: #f0fdf4; border-color: #22c55e; color: #166534; }
    .message.error { background: #fef2f2; border-color: #ef4444; color: #991b1b; }
  </style>
</head>
<body>
  <div class="container">
    <h1>Issue Companion</h1>
    <p class="subtitle">Select your identity to continue</p>

    <label for="userSelect">Your Name</label>
    <select id="userSelect">
      <option value="">-- Select --</option>
    </select>

    <button onclick="signIn()">Sign In</button>

    <div id="message" class="message"></div>
  </div>

  <script>
    const NURSERY_LIST = [
  {name:"Abacus Day Nursery",nursery:"Abacus Day Nursery",zone:"BlueWater",isHR:false,email:"abacus@completechildcare.co.uk"},
  {name:"Bees Knees Day Nursery",nursery:"Bees Knees Day Nursery",zone:"BlueWater",isHR:false,email:"beesknees@completechildcare.co.uk"},
  {name:"Northumberland Day Nursery",nursery:"Northumberland Day Nursery",zone:"BlueWater",isHR:false,email:"northumberland@completechildcare.co.uk"},
  {name:"Smart Tots Day Nursery",nursery:"Smart Tots Day Nursery",zone:"BlueWater",isHR:false,email:"smarttots@completechildcare.co.uk"},
  {name:"Saltway Day Nursery",nursery:"Saltway Day Nursery",zone:"BlueWater",isHR:false,email:"saltway@completechildcare.co.uk"},
  {name:"Cedars Day Nursery",nursery:"Cedars Day Nursery",zone:"BlueWater",isHR:false,email:"cedars@completechildcare.co.uk"},
  {name:"Cedars @ Boot Farm",nursery:"Cedars @ Boot Farm",zone:"BlueWater",isHR:false,email:"bootfarm@completechildcare.co.uk"},
  {name:"Lower Earley Day Nursery",nursery:"Lower Earley Day Nursery",zone:"BlueWater",isHR:false,email:"lowerearley@completechildcare.co.uk"},
  {name:"Our Den @ Hillside",nursery:"Our Den @ Hillside",zone:"BlueWater",isHR:false,email:"ourden@completechildcare.co.uk"},
  {name:"Bramley Wood Day Nursery",nursery:"Bramley Wood Day Nursery",zone:"Greenwood",isHR:false,email:"bramleywood@completechildcare.co.uk"},
  {name:"Hazebrouck Day Nursery",nursery:"Hazebrouck Day Nursery",zone:"Greenwood",isHR:false,email:"hazebrouck@completechildcare.co.uk"},
  {name:"Kingsclere Day Nursery",nursery:"Kingsclere Day Nursery",zone:"Greenwood",isHR:false,email:"kingsclere@completechildcare.co.uk"},
  {name:"Merrydale Day Nursery",nursery:"Merrydale Day Nursery",zone:"Greenwood",isHR:false,email:"merrydale@completechildcare.co.uk"},
  {name:"Stepping Stones Day Nursery",nursery:"Stepping Stones Day Nursery",zone:"Greenwood",isHR:false,email:"steppingstones@completechildcare.co.uk"},
  {name:"Happitots Day Nursery",nursery:"Happitots Day Nursery",zone:"Greenwood",isHR:false,email:"happitots@completechildcare.co.uk"},
  {name:"Finchampstead Day Nursery",nursery:"Finchampstead Day Nursery",zone:"Greenwood",isHR:false,email:"finchampstead@completechildcare.co.uk"},
  {name:"Woosehill Day Nursery",nursery:"Woosehill Day Nursery",zone:"Greenwood",isHR:false,email:"woosehill@completechildcare.co.uk"},
];

    const MGMT_LIST = [
  {name:"Pav Bilkhu",nursery:"BlueWater Area",title:"Area Manager",isHR:true,canViewDashboard:true,zone:"BlueWater",email:"pav.bilkhu@completechildcare.co.uk"},
  {name:"Leanne Maynard",nursery:"Greenwood Area",title:"Area Manager",isHR:true,canViewDashboard:true,zone:"Greenwood",email:"Leanne.Maynard@completechildcare.co.uk"},
  {name:"Ellie Richards",nursery:"Head Office",title:"Compliance Lead",isHR:true,canViewDashboard:true,zone:"all",email:"Ellie.Richards@completechildcare.co.uk"},
  {name:"Emma McIntyre",nursery:"Head Office",title:"Chief Commercial Officer",isHR:true,canViewDashboard:true,zone:"all",email:"Emma.McIntyre@completechildcare.co.uk"},
  {name:"Alec Hodson",nursery:"Head Office",title:"Group Chief Executive",isHR:true,canViewDashboard:true,zone:"all",email:"alec.hodson@completechildcare.co.uk"},
  {name:"Louise Medley",nursery:"Head Office",title:"EA to Group CEO",isHR:true,canViewDashboard:true,zone:"all",email:"louise.medley@completechildcare.co.uk"},
];

    function populateSelect() {
      const select = document.getElementById('userSelect');

      console.log('[SIGNIN] Populating dropdown...');
      console.log('[SIGNIN] NURSERY_LIST:', NURSERY_LIST.length, 'items');
      console.log('[SIGNIN] MGMT_LIST:', MGMT_LIST.length, 'items');

      // Add nursery managers
      for(let i = 0; i < NURSERY_LIST.length; i++) {
        const opt = document.createElement('option');
        opt.value = 'n:' + i;
        opt.textContent = NURSERY_LIST[i].nursery;
        select.appendChild(opt);
      }

      // Add separator
      const sep = document.createElement('option');
      sep.disabled = true;
      sep.textContent = '--- Management ---';
      select.appendChild(sep);

      // Add management
      for(let i = 0; i < MGMT_LIST.length; i++) {
        const opt = document.createElement('option');
        opt.value = 'm:' + i;
        opt.textContent = MGMT_LIST[i].name;
        select.appendChild(opt);
      }

      console.log('[SIGNIN] Dropdown populated successfully');
    }

    function showMessage(text, type) {
      const msg = document.getElementById('message');
      msg.textContent = text;
      msg.className = 'message show ' + type;
    }

    function signIn() {
      const select = document.getElementById('userSelect');
      const val = select.value;

      if(!val) {
        showMessage('Please select your identity', 'error');
        return;
      }

      const [type, idx] = val.split(':');
      const user = type === 'n' ? NURSERY_LIST[parseInt(idx)] : MGMT_LIST[parseInt(idx)];

      console.log('[SIGNIN] Selected:', user.name || user.nursery);
      showMessage('Signing in...', 'success');

      try {
        sessionStorage.setItem('icSession', JSON.stringify(user));
        console.log('[SIGNIN] Session stored, redirecting...');

        setTimeout(() => {
          window.location.href = '/issue-companion/';
        }, 500);
      } catch(e) {
        console.error('[SIGNIN] Error:', e);
        showMessage('Error: ' + e.message, 'error');
      }
    }

    // Populate on load
    window.addEventListener('load', populateSelect);
    console.log('[SIGNIN] Page loaded');
  </script>
</body>
</html>
