<!DOCTYPE html>
<html>
<head>
  <title>Issue Companion - Minimal Test</title>
  <style>
    body { font-family: Arial; padding: 40px; background: #f5f5f5; }
    .box { background: white; padding: 30px; border-radius: 8px; max-width: 400px; }
    select { width: 100%; padding: 10px; font-size: 14px; margin: 10px 0; }
    button { padding: 10px 20px; background: #007bff; color: white; border: none; border-radius: 4px; cursor: pointer; }
    .log { background: #f0f0f0; padding: 10px; margin: 10px 0; border-left: 3px solid #007bff; font-family: monospace; font-size: 12px; max-height: 200px; overflow-y: auto; }
  </style>
</head>
<body>
  <div class="box">
    <h1>Issue Companion - Minimal Sign-In</h1>

    <p>Select your identity:</p>
    <select id="idSelect">
      <option value="">-- Loading --</option>
    </select>

    <button onclick="signIn()">Sign In</button>

    <div class="log" id="log"></div>
  </div>

  <script>
    // Test data
    const NURSERY_LIST = [
      {name:"Abacus Day Nursery",nursery:"Abacus Day Nursery",zone:"BlueWater",isHR:false,email:"abacus@completechildcare.co.uk"},
      {name:"Bees Knees Day Nursery",nursery:"Bees Knees Day Nursery",zone:"BlueWater",isHR:false,email:"beesknees@completechildcare.co.uk"},
      {name:"Bramley Wood Day Nursery",nursery:"Bramley Wood Day Nursery",zone:"Greenwood",isHR:false,email:"bramleywood@completechildcare.co.uk"}
    ];

    const MGMT_LIST = [
      {name:"Alec Hodson",title:"Group Chief Executive",email:"alec.hodson@completechildcare.co.uk"},
      {name:"Emma McIntyre",title:"Chief Commercial Officer",email:"emma.mcintyre@completechildcare.co.uk"},
      {name:"Pav Bilkhu",title:"Area Manager - BlueWater",email:"pav.bilkhu@completechildcare.co.uk"}
    ];

    function log(msg) {
      const el = document.getElementById('log');
      const line = document.createElement('div');
      line.textContent = msg;
      el.appendChild(line);
      el.scrollTop = el.scrollHeight;
      console.log(msg);
    }

    function populate() {
      log('[POPULATE] Starting...');

      const sel = document.getElementById('idSelect');
      if(!sel) {
        log('[ERROR] Select not found!');
        return;
      }

      log('[POPULATE] Select found');

      sel.innerHTML = '<option value="">-- Select nursery or name --</option>';

      // Add nurseries
      const ng = document.createElement('optgroup');
      ng.label = 'Nurseries';
      NURSERY_LIST.forEach((u, i) => {
        const o = document.createElement('option');
        o.value = 'n:' + i;
        o.textContent = u.nursery;
        ng.appendChild(o);
      });
      sel.appendChild(ng);
      log('[POPULATE] Added ' + NURSERY_LIST.length + ' nurseries');

      // Add management
      const mg = document.createElement('optgroup');
      mg.label = 'Management';
      MGMT_LIST.forEach((u, i) => {
        const o = document.createElement('option');
        o.value = 'm:' + i;
        o.textContent = u.name + ' — ' + u.title;
        mg.appendChild(o);
      });
      sel.appendChild(mg);
      log('[POPULATE] Added ' + MGMT_LIST.length + ' management');

      log('[POPULATE] SUCCESS: ' + sel.options.length + ' total options');
    }

    function signIn() {
      const sel = document.getElementById('idSelect');
      const val = sel.value;

      if(!val) {
        log('[SIGNIN] No selection!');
        return;
      }

      const [type, idx] = val.split(':');
      let user;

      if(type === 'n') {
        user = NURSERY_LIST[parseInt(idx)];
      } else {
        user = MGMT_LIST[parseInt(idx)];
      }

      log('[SIGNIN] Selected: ' + (user.name || user.nursery));
      log('[SIGNIN] Storing session...');

      try {
        sessionStorage.setItem('minimalSession', JSON.stringify(user));
        log('[SIGNIN] Stored OK');
      } catch(e) {
        log('[SIGNIN] Store error: ' + e.message);
      }
    }

    // Populate on load
    window.addEventListener('load', populate);

    // Also try immediately
    if(document.readyState !== 'loading') {
      populate();
    }
  function applySession(){
  if(!SESSION) return;
  document.getElementById('sessionUserName').textContent = SESSION.name||SESSION.nursery;
  document.getElementById('sessionNursery').textContent = SESSION.isHR ? (SESSION.title+' — '+SESSION.nursery) : SESSION.nursery;
  if(SESSION.canViewDashboard){
    document.getElementById('mgmtNavSection').style.display='block';
    document.getElementById('mgmtNavlist').style.display='flex';
  } else {
    document.getElementById('mgmtNavSection').style.display='none';
    document.getElementById('mgmtNavlist').style.display='none';
  }
}

async function resolveIdentityFromGraph(){
  showLoading('Signing you in...');
  try {
    const me = await graphFetch('GET', '/me?$select=displayName,mail,userPrincipalName');
    const email = me.mail || me.userPrincipalName || '';
    let user = matchUserByEmail(email);
    if(!user) user = matchUserByDisplayName(me.displayName||'');
    if(user){
      SESSION = user;
      storeSession(SESSION);
      document.getElementById('identityModal').classList.remove('active');
      applySession();
    } else {
      // Graph auth worked but user not in our list — show manual picker
      document.getElementById('identityModal').classList.add('active');
      populateIdentitySelect();
    }
  } catch(e){
    document.getElementById('identityModal').classList.add('active');
    populateIdentitySelect();
  } finally { hideLoading(); }
}

/* ================================================================
   ISSUE LOGGING
   ================================================================ */
function selectCat(tile){
  document.querySelectorAll('.cat-tile').forEach(t=>t.classList.remove('selected'));
  tile.classList.add('selected');
  selectedCat=tile.getAttribute('data-cat');
  const name=tile.getAttribute('data-name');
  document.getElementById('logCardTitle').textContent='Log an issue — '+name;
  document.getElementById('logCardSub').textContent="Describe what's happening below, then rate how urgent it feels.";
  document.getElementById('copilotPanel').classList.remove('show');
  document.getElementById('confirmScreen').classList.remove('show');
  document.getElementById('confirmScreen').style.display='none';
  document.getElementById('logCard').querySelectorAll('.card-title,.card-sub,label,.desc-box,.char-hint,.urgency-row,.btn-row').forEach(e=>e.style.display='');
}

function selectUrgency(pill){
  document.querySelectorAll('.urgency-pill').forEach(p=>p.classList.remove('active'));
  pill.classList.add('active');
  selectedUrgency=pill.getAttribute('data-level');
}

document.getElementById('descBox').addEventListener('input',function(){
  document.getElementById('charHint').textContent=this.value.length+' characters';
});

function severityScore(text,catId){
  const t=text.toLowerCase();
  const kb=COPILOT_KB[catId]||COPILOT_KB['09'];
  for(const kw of (kb.criticalKeywords||[])){if(t.includes(kw.toLowerCase()))return 'critical';}
  for(const kw of (kb.highKeywords||[])){if(t.includes(kw.toLowerCase()))return 'high';}
  const globalCrit=["child missing","police","ambulance","fire","gas leak","flood","RIDDOR","LADO","data breach","ratio breach"];
  for(const kw of globalCrit){if(t.includes(kw.toLowerCase()))return 'critical';}
  return null;
}

function openCopilotFromSidebar(){
  const logBtn=document.querySelector('button[data-page="log"]');
  showPage('log',logBtn);
  const panel=document.getElementById('copilotPanel');
  if(panel&&panel.classList.contains('show')){
    setTimeout(()=>panel.scrollIntoView({behavior:'smooth',block:'start'}),100);
    return;
  }
  setTimeout(()=>{const box=document.getElementById('descBox');if(box){box.focus();box.scrollIntoView({behavior:'smooth',block:'center'});}},150);
}

function runCopilot(){
  const desc=document.getElementById('descBox').value.trim();
  if(!desc){alert('Please describe the issue before getting guidance.');return;}
  if(!selectedUrgency){alert('Please select an urgency level.');return;}
  if(!selectedCat){alert('Please select a category.');return;}
  const btn=document.getElementById('copilotBtn');
  btn.innerHTML='<span class="spinner"></span>Analysing...';
  btn.disabled=true;
  setTimeout(()=>{btn.innerHTML='Get Copilot guidance';btn.disabled=false;showCopilotResponse(desc);},1400);
}

function showCopilotResponse(desc){
  const kb=COPILOT_KB[selectedCat]||COPILOT_KB['09'];
  const catTile=document.querySelector('.cat-tile.selected');
  const catName=catTile?catTile.getAttribute('data-name'):'this category';
  document.getElementById('copilotBadgeText').textContent='COPILOT ASSESSMENT — cross-checked against '+catName+' policy';
  document.getElementById('policyText').textContent=kb.policy;
  document.getElementById('policySource').textContent='Source: '+kb.source;
  const ol=document.getElementById('stepsList');
  ol.innerHTML='';
  kb.steps.forEach(s=>{const li=document.createElement('li');li.textContent=s;ol.appendChild(li);});
  const srcContainer=document.getElementById('copilotSources');
  if(srcContainer) srcContainer.innerHTML=kb.sources?sourcesPanel(kb.sources):'';
  copilotAssessedLevel=severityScore(desc,selectedCat);
  const userLevel=selectedUrgency;
  const disc=document.getElementById('discrepancyAlert');
  if(copilotAssessedLevel&&LEVEL_ORDER[copilotAssessedLevel]>LEVEL_ORDER[userLevel]){
    const diff=LEVEL_ORDER[copilotAssessedLevel]-LEVEL_ORDER[userLevel];
    disc.className=diff>=2?'discrepancy-alert':'discrepancy-alert amber';
    disc.style.display='block';
    disc.innerHTML='<strong>Your rating and Copilot\'s assessment differ.</strong>Based on your description, Copilot assesses this as <strong>'+LEVEL_LABEL[copilotAssessedLevel]+'</strong>, which is higher than your rating of '+LEVEL_LABEL[userLevel]+'. The higher rating will govern where this is routed. Recommend updating your selection before submitting.';
  } else {
    disc.style.display='none'; copilotAssessedLevel=null;
  }
  const governingLevel=copilotAssessedLevel||userLevel;
  const routing=ROUTING[selectedCat]||ROUTING['09'];
  let ratingText='';
  if(governingLevel==='critical') ratingText='This issue is rated <strong>Critical</strong>. Email and Teams alert to '+routing.tier4+' (ultimate escalation) and '+routing.tier3+' (CCO). For unresolved compliance, safeguarding or litigation issues, '+routing.tier4+' is the final authority.';
  else if(governingLevel==='high') ratingText='This issue is rated <strong>High</strong>. Escalation routes first to '+routing.tier2+' (24–48 hour response target). If unresolved, escalates to '+routing.tier3+'.';
  else if(governingLevel==='medium') ratingText='This issue is rated <strong>Medium</strong>. If you escalate, it routes to '+routing.tier2+' (3 working day response target). If unresolved, escalates to '+routing.tier3+'.';
  else ratingText='This issue is rated <strong>Low</strong>. No escalation required — log it, take the first steps, and monitor.';
  document.getElementById('copilotRatingText').innerHTML=ratingText;
  const governingLabel=LEVEL_LABEL[governingLevel];
  document.getElementById('escalateBtn').textContent='Escalate as '+governingLabel;
  document.getElementById('escalateDesc').textContent=governingLevel==='critical'?
    'Opens email and Teams message to '+routing.tier4+' and '+routing.tier3+' (CCO). Send when they open. Response target: 2 hours.':
    'Routes to '+routing.tier2+'. If unresolved, escalates to '+routing.tier3+'.';
  document.getElementById('copilotPanel').classList.add('show');
  document.getElementById('copilotPanel').scrollIntoView({behavior:'smooth',block:'nearest'});
}

async function markActioned(){
  const desc=document.getElementById('descBox').value.trim();
  const issue=buildIssue(desc,'actioned');
  showLoading('Saving issue...');
  try {
    await writeIssue(issue);
    await notifyOnSubmit(issue);
    showConfirmation('actioned',issue);
  } catch(e){
    showToast('Save failed — please try again.');
  } finally { hideLoading(); }
}

async function escalateIssue(){
  const governingLevel=copilotAssessedLevel||selectedUrgency;
  if(governingLevel==='critical'){ triggerCriticalEscalation(); return; }
  const desc=document.getElementById('descBox').value.trim();
  const issue=buildIssue(desc,'escalated');
  showLoading('Escalating issue...');
  try {
    await writeIssue(issue);
    await notifyOnSubmit(issue);
    showConfirmation('escalated',issue);
  } catch(e){
    showToast('Save failed — please try again.');
  } finally { hideLoading(); }
}

function buildIssue(desc, status){
  const catTile=document.querySelector('.cat-tile.selected');
  const catName=catTile?catTile.getAttribute('data-name'):'Other';
  const governingLevel=copilotAssessedLevel||selectedUrgency;
  const id='ISS-'+Date.now();
  return {
    id, nursery:SESSION?SESSION.nursery:'Unknown', zone:SESSION?SESSION.zone||'':'',
    loggedBy:SESSION?SESSION.name||SESSION.nursery:'Unknown',
    loggedByEmail:SESSION?SESSION.email||'':'',
    cat:selectedCat, catName, desc,
    userRating:selectedUrgency, copilotRating:copilotAssessedLevel,
    governingRating:governingLevel, status,
    createdAt:new Date().toISOString(), updatedAt:new Date().toISOString(),
    resolutionNote:''
  };
}

async function saveDraft(){
  const desc=document.getElementById('descBox').value.trim();
  if(!desc){alert('Add a description before saving as draft.');return;}
  if(!selectedCat){alert('Select a category before saving.');return;}
  const issue=buildIssue(desc,'draft');
  showLoading('Saving draft...');
  try {
    await writeIssue(issue);
    showToast('Draft saved. Find it in My Issues.');
  } catch(e){
    showToast('Save failed — please try again.');
  } finally { hideLoading(); }
}

async function notifyOnSubmit(issue){
  const routing=ROUTING[issue.cat]||ROUTING['09'];
  const level=issue.governingRating;
  const recipients=[];
  // Always notify the relevant area manager
  const amEmail = issue.zone==='BlueWater' ? 'pav.bilkhu@completechildcare.co.uk' : 'Leanne.Maynard@completechildcare.co.uk';
  if(level==='critical'||level==='high'){
    recipients.push('alec.hodson@completechildcare.co.uk');
    recipients.push('Emma.McIntyre@completechildcare.co.uk');
    recipients.push('louise.medley@completechildcare.co.uk');
    recipients.push(amEmail);
  } else if(level==='medium'){
    recipients.push(amEmail);
    recipients.push('louise.medley@completechildcare.co.uk');
  } else {
    recipients.push(amEmail);
  }
  // Add compliance lead for relevant categories
  if(['01','02','04','06'].includes(issue.cat)) recipients.push('Ellie.Richards@completechildcare.co.uk');
  const unique=[...new Set(recipients)];
  const subject=`[Issue Companion] ${LEVEL_LABEL[level]} issue logged — ${issue.catName} — ${issue.nursery} [${issue.id}]`;
  const extra=`<strong>A new ${LEVEL_LABEL[level]} issue has been logged.</strong> Please review and respond in the Issue Companion.`;
  await sendEmail(unique, subject, issueEmailBody(issue, extra));
}

function showConfirmation(type, issue){
  document.querySelectorAll('#logCard label,#logCard .desc-box,#logCard .char-hint,#logCard .urgency-row,#logCard .btn-row,#logCard .copilot-panel').forEach(e=>e.style.display='none');
  document.getElementById('logCardTitle').style.display='none';
  document.getElementById('logCardSub').style.display='none';
  const screen=document.getElementById('confirmScreen');
  screen.style.display='block'; screen.classList.add('show');
  const routing=ROUTING[selectedCat]||ROUTING['09'];
  const governingLevel=copilotAssessedLevel||selectedUrgency;
  if(type==='actioned'){
    document.getElementById('confirmIcon').textContent='✓';
    document.getElementById('confirmTitle').textContent='Issue logged and actioned';
    document.getElementById('confirmMsg').textContent='Your interim steps have been noted. This issue is saved and visible to your management team. You can add a resolution note from My Issues at any time.';
    document.getElementById('notifiedList').innerHTML='<li>Saved to the shared issue log</li><li>Your Area Manager has been notified by email</li>';
  } else {
    const label=LEVEL_LABEL[governingLevel];
    document.getElementById('confirmIcon').textContent=governingLevel==='critical'?'🔴':'⬆';
    document.getElementById('confirmTitle').textContent='Issue escalated as '+label;
    const notified=[];
    if(governingLevel==='critical'){
      notified.push('<li>Alec Hodson — email notification sent</li>');
      notified.push('<li>Emma McIntyre (CCO) — email notification sent</li>');
      notified.push('<li>Louise Medley (EA) — email notification sent</li>');
      notified.push('<li>Your Area Manager — email notification sent</li>');
      document.getElementById('confirmMsg').textContent='A critical alert has been sent. Response target: within 2 hours.';
    } else if(governingLevel==='high'){
      notified.push('<li>'+routing.tier2+' — email notification sent</li>');
      notified.push('<li>Louise Medley (EA to Group CEO) — copied</li>');
      document.getElementById('confirmMsg').textContent='Your Area Manager and the relevant lead have been notified. Response target is 24–48 hours.';
    } else {
      notified.push('<li>'+routing.tier2+' — email notification sent</li>');
      document.getElementById('confirmMsg').textContent='Your Area Manager has been notified. Response target is 3 working days.';
    }
    document.getElementById('notifiedList').innerHTML=notified.join('');
  }
  screen.scrollIntoView({behavior:'smooth',block:'start'});
}

function resetForm(){
  selectedCat=null; selectedUrgency=null; copilotAssessedLevel=null;
  document.querySelectorAll('.cat-tile').forEach(t=>t.classList.remove('selected'));
  document.querySelectorAll('.urgency-pill').forEach(p=>p.classList.remove('active'));
  document.getElementById('descBox').value='';
  document.getElementById('charHint').textContent='0 characters';
  document.getElementById('copilotPanel').classList.remove('show');
  document.getElementById('confirmScreen').classList.remove('show');
  document.getElementById('confirmScreen').style.display='none';
  document.getElementById('logCardTitle').textContent='Log an issue';
  document.getElementById('logCardSub').textContent="Select a category above, then describe what's happening.";
  document.querySelectorAll('#logCard label,#logCard .desc-box,#logCard .char-hint,#logCard .urgency-row,#logCard .btn-row').forEach(e=>e.style.display='');
  document.getElementById('logCardTitle').style.display='';
  document.getElementById('logCardSub').style.display='';
  const sb=document.getElementById('searchBox'); if(sb) sb.value='';
  const sr=document.getElementById('searchResults'); if(sr){sr.style.display='none';sr.innerHTML='';}
  const main=document.getElementById('main'); if(main) main.scrollTop=0;
  window.scrollTo(0,0);
}

/* ================================================================
   MY ISSUES
   ================================================================ */
async function renderMyIssues(){
  const el=document.getElementById('myIssuesContent');
  if(!SESSION){el.innerHTML='<p style="color:var(--grey);font-size:13.5px;">Sign in to see your issues.</p>';return;}
  el.innerHTML='<div style="text-align:center;padding:40px;"><div class="spinner" style="margin:0 auto;"></div><p style="color:var(--grey);margin-top:14px;">Loading issues...</p></div>';
  try {
    const issues = await getMyIssues();
    if(!issues.length){el.innerHTML='<p style="color:var(--grey);font-size:13.5px;">No issues logged yet. Use the Log an issue page to get started.</p>';return;}
    let html='<table class="log-table"><thead><tr><th>ID</th><th>Category</th><th>Severity</th><th>Status</th><th>Logged</th><th>Comments</th></tr></thead><tbody>';
    issues.forEach(i=>{
      const d=new Date(i.createdAt);
      const ds=d.toLocaleDateString('en-GB',{day:'2-digit',month:'short',year:'numeric'});
      html+=`<tr class="issue-row" onclick="openIssueDetail('${i.id}','myissues')">
        <td style="font-family:var(--font-mono);font-size:11.5px;">${i.id.slice(-8)}</td>
        <td>${i.catName}</td>
        <td><span class="badge badge-${i.governingRating}">${LEVEL_LABEL[i.governingRating]||i.governingRating}</span></td>
        <td><span class="badge badge-${i.status}">${i.status.charAt(0).toUpperCase()+i.status.slice(1)}</span></td>
        <td style="font-size:12.5px;">${ds}</td>
        <td style="font-size:12px;color:var(--grey);">&#128172; View</td>
      </tr>`;
      if(i.desc){html+=`<tr><td colspan="6" style="padding:0 12px 12px;font-size:12.5px;color:var(--grey);">${i.desc.slice(0,180)}${i.desc.length>180?'…':''}</td></tr>`;}
    });
    html+='</tbody></table>';
    el.innerHTML=html;
  } catch(e){
    el.innerHTML='<p style="color:var(--red);font-size:13.5px;">Could not load issues. Please check your connection.</p>';
  }
}

/* ================================================================
   ALL ISSUES (management)
   ================================================================ */
async function renderAllIssues(){
  const el=document.getElementById('allIssuesContent');
  if(!(SESSION&&SESSION.canViewDashboard)){
    el.innerHTML='<p style="color:var(--red);font-size:13.5px;">Access restricted.</p>';return;
  }
  el.innerHTML='<div style="text-align:center;padding:40px;"><div class="spinner" style="margin:0 auto;"></div></div>';
  try {
    let issues=(await getAllIssues()).filter(i=>!i.archived);
    const sev=document.getElementById('filterSeverity').value;
    const stat=document.getElementById('filterStatus').value;
    if(sev) issues=issues.filter(i=>i.governingRating===sev);
    if(stat) issues=issues.filter(i=>i.status===stat);
    if(!issues.length){el.innerHTML='<p style="color:var(--grey);font-size:13.5px;">No issues match the current filters.</p>';return;}
    let html='<table class="log-table"><thead><tr><th>ID</th><th>Setting</th><th>Category</th><th>Severity</th><th>Status</th><th>Logged</th></tr></thead><tbody>';
    issues.forEach(i=>{
      const d=new Date(i.createdAt);
      const ds=d.toLocaleDateString('en-GB',{day:'2-digit',month:'short'});
      html+=`<tr class="issue-row" onclick="openIssueDetail('${i.id}','allissues')">
        <td style="font-family:var(--font-mono);font-size:11px;">${i.id.slice(-8)}</td>
        <td style="font-size:12.5px;">${i.nursery}</td>
        <td style="font-size:12.5px;">${i.catName}</td>
        <td><span class="badge badge-${i.governingRating}">${LEVEL_LABEL[i.governingRating]||i.governingRating}</span></td>
        <td><span class="badge badge-${i.status}">${i.status.charAt(0).toUpperCase()+i.status.slice(1)}</span></td>
        <td style="font-size:12px;">${ds}</td>
      </tr>`;
      if(i.desc){html+=`<tr><td colspan="6" style="padding:0 12px 12px;font-size:12px;color:var(--grey);">${i.desc.slice(0,200)}${i.desc.length>200?'…':''}</td></tr>`;}
    });
    html+='</tbody></table>';
    el.innerHTML=html;
  } catch(e){
    el.innerHTML='<p style="color:var(--red);font-size:13.5px;">Could not load issues.</p>';
  }
}

function renderArchivedIssues(){
  if(!(SESSION&&SESSION.canViewDashboard)){
    const el=document.getElementById('archivedIssuesContent');
    if(el) el.innerHTML='<p style="color:var(--red);font-size:13.5px;">Access restricted.</p>';
    return;
  }
  showLoading('Loading archived issues...');
  try {
    const allIssues=await getAllIssues();
    let issues=allIssues.filter(i=>i.archived);
    const sev=document.getElementById('filterArchivedSeverity').value;
    const stat=document.getElementById('filterArchivedStatus').value;
    if(sev)issues=issues.filter(i=>i.governingRating===sev);
    if(stat)issues=issues.filter(i=>i.status===stat);
    if(!issues.length){
      document.getElementById('archivedIssuesContent').innerHTML='<p style="color:var(--grey);font-size:13.5px;">No archived issues match the current filters.</p>';
      hideLoading();
      return;
    }
    const sorted=[...issues].sort((a,b)=>new Date(b.updatedAt)-new Date(a.updatedAt));
    let html='<table class="log-table"><thead><tr><th>ID</th><th>Setting</th><th>Category</th><th>Severity</th><th>Status</th><th>Archived</th></tr></thead><tbody>';
    sorted.forEach(i=>{
      const d=new Date(i.updatedAt);
      const ds=d.toLocaleDateString('en-GB',{day:'2-digit',month:'short'});
      html+=`<tr style="opacity:0.7;">
        <td style="font-family:var(--font-mono);font-size:11px;">${i.id.slice(-8)}</td>
        <td style="font-size:12.5px;">${i.nursery}</td>
        <td style="font-size:12.5px;">${i.catName}</td>
        <td><span class="badge badge-${i.governingRating}">${LEVEL_LABEL[i.governingRating]||i.governingRating}</span></td>
        <td><span class="badge badge-${i.status}">${i.status.charAt(0).toUpperCase()+i.status.slice(1)}</span></td>
        <td style="font-size:12px;color:var(--amber);">✓ ${ds}</td>
      </tr>`;

async function renderDashboard(){
  if(!(SESSION&&SESSION.canViewDashboard)){
    const el=document.getElementById('kpiGrid');
    if(el) el.innerHTML='<p style="color:var(--red);font-size:13.5px;">Access restricted.</p>';
    return;
  }
  showLoading('Loading dashboard...');
  try {
    const issues=await getAllIssues();
    const open=issues.filter(i=>i.status!=='closed'&&i.status!=='draft'&&!i.archived);
    const escalated=issues.filter(i=>i.status==='escalated'&&!i.archived);
    const critical=issues.filter(i=>i.governingRating==='critical'&&i.status!=='closed'&&!i.archived);
    const mismatches=issues.filter(i=>i.copilotRating&&i.copilotRating!==i.userRating);
    const kpiGrid=document.getElementById('kpiGrid');
    if(kpiGrid) kpiGrid.innerHTML=`
      <div class="kpi-card"><div class="num">${issues.length}</div><div class="lbl">Total logged</div></div>
      <div class="kpi-card"><div class="num">${open.length}</div><div class="lbl">Open issues</div></div>
      <div class="kpi-card"><div class="num">${escalated.length}</div><div class="lbl">Escalated</div></div>
      <div class="kpi-card"><div class="num">${mismatches.length}</div><div class="lbl">Rating mismatches</div></div>`;
    const byCat={};
    issues.forEach(i=>{byCat[i.catName]=(byCat[i.catName]||0)+1;});
    const sorted=Object.entries(byCat).sort((a,b)=>b[1]-a[1]);
    const max=sorted.length?sorted[0][1]:1;
    const barEl=document.getElementById('barChart');
    if(barEl){
      if(!sorted.length){barEl.innerHTML='<p style="font-size:13px;color:var(--grey);">No issues logged yet.</p>';}
      else barEl.innerHTML=sorted.map(([cat,n])=>`
        <div class="bar-row">
          <span class="lbl">${cat.length>22?cat.slice(0,22)+'…':cat}</span>
          <div class="bar-track"><div class="bar-fill" style="width:${Math.round(n/max*100)}%"></div></div>
          <span class="val">${n}</span>
        </div>`).join('');
    }
    const critEl=document.getElementById('criticalList');
    if(critEl){
      const highAndCrit=issues.filter(i=>(i.governingRating==='critical'||i.governingRating==='high')&&i.status!=='closed');
      if(!highAndCrit.length) critEl.innerHTML='<p style="font-size:13px;color:var(--grey);">No open critical or high issues.</p>';
      else critEl.innerHTML=highAndCrit.map(i=>`
        <div style="padding:12px 0;border-bottom:1px solid var(--line);font-size:13px;cursor:pointer;" onclick="openIssueDetail('${i.id}','dashboard')">
          <span class="badge badge-${i.governingRating}" style="margin-right:8px;">${LEVEL_LABEL[i.governingRating]}</span>
          <strong>${i.catName}</strong> — ${i.nursery}
          <span style="color:var(--grey);margin-left:10px;font-size:12px;">${new Date(i.createdAt).toLocaleDateString('en-GB')}</span>
          <div style="color:var(--grey);margin-top:4px;font-size:12.5px;">${i.desc?i.desc.slice(0,120)+'…':''}</div>
        </div>`).join('');
    }
  } catch(e){
    const el=document.getElementById('kpiGrid');
    if(el) el.innerHTML='<p style="color:var(--red);font-size:13.5px;">Could not load dashboard.</p>';
  } finally { hideLoading(); }
}

async function changeIssueStatus(issueId, newStatus){
  showLoading('Updating status...');
  try {
    const issue = await getIssueById(issueId);
    if(!issue) return;
    const oldStatus = issue.status;
    issue.status = newStatus;
    issue.updatedAt = new Date().toISOString();
    await writeIssue(issue);
    // Notify the nursery manager of the status change
    if(issue.loggedByEmail){
      const subject = `[Issue Companion] Issue ${issue.id.slice(-8)} status updated to ${newStatus.charAt(0).toUpperCase()+newStatus.slice(1)}`;
      const extra = `<strong>${SESSION.name||SESSION.nursery}</strong> has updated the status of your issue from <strong>${oldStatus}</strong> to <strong>${newStatus.charAt(0).toUpperCase()+newStatus.slice(1)}</strong>.`;
      await sendEmail(issue.loggedByEmail, subject, issueEmailBody(issue, extra));
    }
    showToast('Status updated to ' + newStatus);
  } catch(e){
    showToast('Failed to update status.');
  } finally { hideLoading(); }
}

async function postReply(issueId){
  const text = document.getElementById('replyText').value.trim();
  if(!text){ alert('Please enter a response before sending.'); return; }
  const isManager = SESSION && SESSION.canViewDashboard;
  showLoading('Sending response...');
  try {
    const comment = {
      id: 'CMT-' + Date.now(),
      issueId,
      authorName: SESSION ? SESSION.name||SESSION.nursery : 'Unknown',
      authorEmail: SESSION ? SESSION.email||'' : '',
      fromManagement: isManager,
      text,
      createdAt: new Date().toISOString()
    };
    await writeComment(comment);
    // Send email notification
    const issue = await getIssueById(issueId);
    if(issue){
      let notifyEmail = '';
      if(isManager){
        // Manager replied — notify the nursery manager who submitted
        notifyEmail = issue.loggedByEmail;
      } else {
        // Nursery manager replied — notify the relevant AM + compliance
        const amEmail = issue.zone==='BlueWater' ? 'pav.bilkhu@completechildcare.co.uk' : 'Leanne.Maynard@completechildcare.co.uk';
        notifyEmail = amEmail;
      }
      if(notifyEmail){
        const subject = `[Issue Companion] New response on issue ${issue.id.slice(-8)} — ${issue.catName} — ${issue.nursery}`;
        const extra = `<strong>${comment.authorName}</strong> has added a response:<br/><br/><em>${text.replace(/\n/g,'<br/>')}</em>`;
        await sendEmail(notifyEmail, subject, issueEmailBody(issue, extra));
      }
    }
    showToast('Response sent.');
    // Reload the detail view
    await openIssueDetail(issueId, previousPage);
  } catch(e){
    showToast('Failed to send response. Please try again.');
  } finally { hideLoading(); }
}

function scoreSearch(v, entry){
  // Score = number of keywords matched, weighted by position in query
  const words = v.split(/\s+/).filter(w=>w.length>2);
  let score = 0;
  for(const kw of entry.keywords){
    if(v.includes(kw)) score += 3;           // full phrase match
    else for(const w of words){
      if(kw.includes(w) || w.includes(kw.split(' ')[0])) score += 1; // word match
    }
  }
  return score;
}

function handleSearch(val){
  const v = val.trim().toLowerCase();
  const el = document.getElementById('searchResults');
  if(v.length < 2){ el.style.display='none'; return; }

  // Score every KB entry
  const scored = SEARCH_KB.map(e=>({...e, score:scoreSearch(v,e)}))
                           .filter(e=>e.score>0)
                           .sort((a,b)=>b.score-a.score);

  el.style.display = 'block';

  if(scored.length === 0){
    // No match — show all categories as pills so user can still pick quickly
    el.innerHTML = `<div class="sr-no-match">
      <p>No exact match found for <strong>"${val.trim()}"</strong> — select the most relevant category below, or describe your issue in more detail.</p>
      <div class="sr-cats">${SEARCH_KB.slice(0,8).map(e=>`
        <div class="sr-cat-pill" onclick="applySearchHint('${e.cat}')">${e.title}</div>`).join('')}
      </div>
    </div>`;
    return;
  }

  // Show top 3 matches as rich cards
  const top = scored.slice(0,3);
  el.innerHTML = top.map((m,i)=>`
    <div class="sr-card${i===0?' sr-best':''}" onclick="applySearchHint('${m.cat}')">
      <div class="sr-header">
        <span class="sr-cat-badge badge-0${m.cat.slice(-1)}">${m.cat} — ${CAT_NAMES[m.cat]}</span>
        ${i===0?'<span style="font-size:11px;font-weight:700;color:var(--amber);margin-left:auto;">Best match</span>':''}
      </div>
      <div class="sr-tip">${m.tip}</div>
      <div class="sr-step"><strong>First step:</strong> ${m.step}</div>
      <div class="sr-action">Tap to select this category &#8594;</div>
    </div>`).join('');
}

function applySearchHint(catId){
  document.getElementById('searchBox').value='';
  document.getElementById('searchResults').style.display='none';
  const tile=document.querySelector(`.cat-tile[data-cat="${catId}"]`);
  if(tile){selectCat(tile);tile.scrollIntoView({behavior:'smooth',block:'center'});}
}

    new Promise(function(_, reject){ setTimeout(function(){ reject(new Error('timeout')); }, ms); })

}

  messagesDiv.appendChild(userMsg);

  input.value = '';
  messagesDiv.scrollTop = messagesDiv.scrollHeight;

  // Simulate agent response
  setTimeout(()=>{
    const agentMsg = document.createElement('div');
    agentMsg.style.cssText = 'background:var(--purple-tint);padding:12px;border-radius:8px;align-self:flex-start;max-width:85%;';
    agentMsg.innerHTML = '<strong>Support Agent:</strong> Thanks for your question! For detailed guidance on this topic, please visit the Issue Companion app or contact your Area Manager. Is there anything else I can help clarify?';
    messagesDiv.appendChild(agentMsg);
    messagesDiv.scrollTop = messagesDiv.scrollHeight;
  }, 600);
}



</script>
</body>
